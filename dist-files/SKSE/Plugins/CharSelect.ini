; CharSelect settings. Delete a line to use its default.

[General]
; Show the character select screen instead of the vanilla main menu.
bReplaceMainMenu = 1
; 0 keeps the vanilla main menu when the game starts, and shows the select
; screen only when you go back to the main menu from a game. F7 on the main
; menu opens it any time.
bReplaceAtStartup = 1
; 1 makes the main menu's Load button open the select screen.
bLobbyOnLoad = 0
; 1 keeps your saves under the same character when you change your look with
; RaceMenu during play. 0 is the game's own way: a new character every time.
bKeepCharacterAfterRaceMenu = 1
; Scan code of the key that enters the lobby from the vanilla main menu (0x41 = F7).
iLobbyHotkey = 0x41
; Write a detailed CharSelect.log (in Documents\My Games\Skyrim Special Edition\SKSE).
; Turn on when reporting a problem; the normal log is enough otherwise.
bDebugLog = 0

[Lobby]
; Location (cell editor ID) used as the select screen, and a fallback if it fails.
; Several separated by commas: a different one at random each time.
sLobbyCell = WhiterunBanneredMare
sFallbackCell = qasmoke
; How many characters stand in the select screen (1-9), most recently played
; first. The rest are still reachable through LOAD.
iMaxCharacters = 5
; What the placeholder figure wears for a character whose appearance isn't saved
; yet (loading that character once saves it). Comma-separated
; 0x<form ID>|<plugin>, equipped in order (a later item replaces an earlier one
; that uses the same body slot). Default: black hood, robes and boots. Use a
; separate hood: mods like WACCF remove the hood from "hooded" robes.
sStandInOutfit = 0x000C5D10|Skyrim.esm, 0x000C5D11|Skyrim.esm, 0x000C5D12|Skyrim.esm
