; Built-in CharSelect lobby layouts, one section per cell editor ID.
; Your own edits (F8 in the lobby) go to Documents\My Games\...\SKSE\CharSelect\Layout.ini
; and override these key by key; RESET TO DEFAULT in the editor brings these back.
;
; Slots fill in order: the most recently played character gets slot 1.
;
; Poses, per slot (characters without these keys just stand and idle):
;   slotNpose      = pose at rest
;   slotNselect    = pose while that character is selected (back to slotNpose after)
;   slotNfurniture = 0x<local form ID>|<plugin>  furniture for sit/sleep poses
;                    (the layout editor's SEAT picker sets this)
;   slotNfurniture = place:0x<base form ID>|<plugin>  spawns that furniture
;                    (a chair, bench or bedroll) at the slot's spot for the lobby
; Poses:
;   standing: stand, warm_hands, warm_hands_crouched, warm_arms, hands_behind_back,
;     drink, read, lute, flute, drum, pray, study, look_far, draw_weapon
;   one-shots (good for slotNselect): salute, applaud, wave, laugh
;   in furniture (needs slotNfurniture): sit, sit_drink, sit_eat, sit_read, sleep
;   on a marker placed at the spot automatically: sit_floor (cross-legged),
;     kneel, pray_kneel, pray_crouched, lie_down, wounded,
;     lean_table / lean_counter / sit_ledge (put the spot at a table, counter or ledge)
;   or event:<AnimEventName> (standing) / sit+event:<AnimEventName> (seated) for any
;   vanilla or modded animation event.

